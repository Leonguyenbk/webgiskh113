name: Đồng bộ dữ liệu GCN

# Mỗi 2 giờ chạy một đợt đồng bộ.
# Đồng bộ tuần tự từng nguồn Google Sheet đang kích hoạt:
# nguồn 1 xong mới tới nguồn 2, rồi nguồn 3...
# Không gọi /sync-all để tránh một request xử lý toàn bộ nguồn.
# Nếu một nguồn lỗi thì ghi nhận lỗi và tiếp tục nguồn kế tiếp.

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Đồng bộ tuần tự từng nguồn GCN
        shell: bash
        run: |
          set -u

          BASE_URL="${BACKEND_URL%/}"

          echo "Lấy danh sách nguồn GCN..."

          SOURCES_JSON=$(curl \
            --fail-with-body \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            "$BASE_URL/api/nguon-gcn") || {
              echo "Không lấy được danh sách nguồn GCN."
              exit 1
            }

          SOURCES=$(echo "$SOURCES_JSON" | jq -c \
            '[.items[] | select(.kich_hoat == true)] | sort_by(.ma_nguon)')

          COUNT=$(echo "$SOURCES" | jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            echo "Không có nguồn GCN nào đang kích hoạt."
            exit 0
          fi

          echo "Có $COUNT nguồn đang kích hoạt."
          echo "Bắt đầu đồng bộ tuần tự..."

          FAILED=0

          for ((i=0; i<COUNT; i++)); do

            MA_NGUON=$(echo "$SOURCES" | jq -r ".[$i].ma_nguon")
            TEN_NGUON=$(echo "$SOURCES" | jq -r ".[$i].ten_nguon // \"\"")

            MA_NGUON_URI=$(printf '%s' "$MA_NGUON" | jq -sRr @uri)

            echo "=================================================="
            echo "[$((i + 1))/$COUNT] Đồng bộ:"
            echo "Mã nguồn: $MA_NGUON"
            echo "Tên nguồn: $TEN_NGUON"

            if curl \
              --fail-with-body \
              --max-time 280 \
              --retry 2 \
              --retry-delay 10 \
              -X POST \
              "$BASE_URL/api/nguon-gcn/$MA_NGUON_URI/sync" \
              -H "X-Import-Token: $IMPORT_TOKEN"
            then
              echo
              echo "OK: $MA_NGUON"
            else
              echo
              echo "LỖI: $MA_NGUON"
              echo "Bỏ qua và tiếp tục nguồn kế tiếp."
              FAILED=$((FAILED + 1))
            fi

          done

          echo "=================================================="
          echo "ĐỒNG BỘ HOÀN TẤT"
          echo "Tổng nguồn: $COUNT"
          echo "Thành công: $((COUNT - FAILED))"
          echo "Lỗi: $FAILED"

          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi

        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}