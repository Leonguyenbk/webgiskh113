function napDanhSachXaNhanh() {
  const sel = document.getElementById("chonXa");
  if (!sel) return;

  huyTomSelectXa();
  sel.innerHTML = "";

  DANH_SACH_XA_CLIENT.forEach(x => {
    const opt = document.createElement("option");
    opt.value = String(x.maXa);
    opt.textContent = `${x.tenXa} - ${x.maXa}`;
    opt.dataset.tenXa = x.tenXa || "";
    opt.dataset.coSheet = x.coSheet ? "1" : "0";
    opt.dataset.coThuMucDrive = x.coThuMucDrive ? "1" : "0";
    if (String(x.maXa) === "24373") opt.selected = true;
    sel.appendChild(opt);
  });

  document.getElementById("maXa").value = sel.value || "24373";
  capNhatDiaChiXa();
  capNhatTrangThaiXa();
  khoiTaoTomSelectXa();
}

function taiBootstrapTuServer() {
  google.script.run
    .withSuccessHandler(cfg => {
      isAdmin = !!cfg.isAdmin;
      if (cfg.danhSachXa && cfg.danhSachXa.length) {
        napDanhSachXaTuMang(cfg.danhSachXa);
      }
    })
    .withFailureHandler(() => {
      // Nếu lỗi cấu hình, vẫn dùng danh sách nhúng sẵn để không làm gián đoạn nhập liệu.
    })
    .getBootstrap();
}

function napDanhSachXaTuMang(list) {
  if (!list || !list.length) return;

  DANH_SACH_XA_SERVER = list;

  const current = val("chonXa") || "24373";
  const sel = document.getElementById("chonXa");
  if (!sel) return;

  huyTomSelectXa();
  sel.innerHTML = "";

  list.forEach(x => {
    const opt = document.createElement("option");
    opt.value = String(x.maXa);
    opt.textContent = `${x.tenXa || "Xã/phường"} - ${x.maXa}`;
    opt.dataset.tenXa = x.tenXa || "";
    opt.dataset.coSheet = x.coSheet ? "1" : "0";
    opt.dataset.coThuMucDrive = x.coThuMucDrive ? "1" : "0";
    opt.dataset.sheetUrl = layLinkSheet(x) || "";
    opt.dataset.driveUrl = layLinkDrive(x) || "";
    if (String(x.maXa) === current) opt.selected = true;
    sel.appendChild(opt);
  });

  if (!sel.value) sel.value = "24373";
  document.getElementById("maXa").value = sel.value;
  capNhatDiaChiXaTheoDanhSach(list);
  capNhatTrangThaiXaTheoDanhSach(list);
  khoiTaoTomSelectXa();
}

function capNhatDiaChiXaTheoDanhSach(list) {
  const xa = list.find(x => String(x.maXa) === val("chonXa"));
  document.getElementById("diaChiThua").value = `${xa ? xa.tenXa : "Xã Ea Kar"}, tỉnh Đắk Lắk`;
}

function capNhatTrangThaiXaTheoDanhSach(list) {
  const xa = list.find(x => String(x.maXa) === val("chonXa"));
  if (!xa) return;

  const sheetText = xa.coSheet ? "Đã có Google Sheet." : "Chưa có Google Sheet.";
  const driveText = xa.coThuMucDrive ? "Đã có thư mục Drive." : "Chưa có thư mục Drive.";
  const sheetUrl = layLinkSheet(xa);
  const driveUrl = layLinkDrive(xa);

  let html = `Đang chọn ${escapeHtml(xa.tenXa || "Xã/phường")} - mã xã ${escapeHtml(xa.maXa)}. ${sheetText} ${driveText}`;
  if (sheetUrl) html += ` <a href="${escapeAttr(sheetUrl)}" target="_blank" rel="noopener">Mở Google Sheet</a>`;
  if (driveUrl) html += ` <a href="${escapeAttr(driveUrl)}" target="_blank" rel="noopener">Mở Drive</a>`;

  setNoticeHtml("trangThaiXa", html, xa.coSheet ? "ok" : "err");
}


function khoiTaoTomSelectXa() {
  const sel = document.getElementById("chonXa");
  if (!sel || typeof TomSelect === "undefined") return;

  huyTomSelectXa();

  tomSelectXa = new TomSelect(sel, {
    create: false,
    maxOptions: 500,
    searchField: ["text"],
    sortField: [{ field: "text", direction: "asc" }],

function layLinkSheet(x) {

  ]);

function layLinkDrive(x) {

function layLinkTuObject(x, keys) {
  if (!x) return "";
  for (const k of keys) {

  }
  return "";
}

function setNoticeHtml(id, html, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = "notice " + type;

}

function escapeAttr(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll('"', "&quot;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

}

function kiemTraTrungNgayKhiNhap() {
  const soTo = val("soTo");
  const soThua = val("soThua");
  if (!soTo || !soThua) return;
  if (dangTrungThua) { setNotice("ketQuaThua", "Thửa này đã được nhập rồi", "err"); return; }

  setNotice("ketQuaThua", "Đang kiểm tra thửa đã nhập chưa...", "muted");

  google.script.run
    .withSuccessHandler(res => {
      if (res && res.trung) {
        dangTrungThua = true;
        daKiemTraThua = false;
        document.getElementById("btnLuu").style.display = "none";
        setNotice("ketQuaThua", "Thửa này đã được nhập rồi", "err");
      } else if (res && res.ok) {
        dangTrungThua = false;
        setNotice("ketQuaThua", "Thửa này chưa có trong dữ liệu đã nhập. Rời ô để kiểm tra trong DSCanThuThap,DangKy (Do VPĐK giao).", "muted");
      } else {
        setNotice("ketQuaThua", (res && res.message) || "Không kiểm tra được trùng thửa.", "err");
      }
    })
    .withFailureHandler(err => {
      setNotice("ketQuaThua", err.message || "Lỗi kiểm tra trùng thửa.", "err");
    })
    .kiemTraTrungNhanh(soTo, soThua, val("maXa") || "24373");
}


function kiemTraThua() {
  const soTo = val("soTo"), soThua = val("soThua");
  daKiemTraThua = false; dangTrungThua = false;
  capNhatSoPhatHanhMacDinh();
  if (!soTo || !soThua) return;
  setNotice("ketQuaThua","Đang kiểm tra số tờ/số thửa...","muted");
  google.script.run.withSuccessHandler(res => {
    if (res.ok) {
      daKiemTraThua = true;
      document.getElementById("maDinhDanh").value = res.data.maDinhDanh || "";
      document.getElementById("dienTichTong").value = res.data.dienTich || "";
      document.getElementById("diaChiThua").value = res.data.diaChiThua || document.getElementById("diaChiThua").value;
      tuDongDienTichDat1(); tinhTongDienTichCon();
      setNotice("ketQuaThua","Đã tìm thấy thửa đất.","ok");
    } else {
      if (res.duplicate) { dangTrungThua = true; document.getElementById("btnLuu").style.display = "none"; }
      setNotice("ketQuaThua",res.message,"err");
    }
  }).withFailureHandler(err => setNotice("ketQuaThua", err.message || "Lỗi kiểm tra thửa đất.", "err"))
    .kiemTraThuaDat(soTo, soThua, val("maXa") || "24373");
}

function themThuaVaoDanhSach() {
  if (dangTrungThua) {
    setNotice("ketQuaThua", "Thửa này đã được nhập rồi", "err");
    return;
  }
  if (!daKiemTraThua) {
    setNotice("ketQuaThua", "Vui lòng kiểm tra số tờ/số thửa hợp lệ trước khi thêm vào danh sách.", "err");
    return;
  }

  const parcel = layThuaHienTai();
  const thua = parcel.thuaDat;
  const key = `${val("maXa")}_${thua.soTo}_${thua.soThua}`;

  const loi = kiemTraThongTinDatTruocKhiThem(parcel);
  if (loi) {
    setNotice("ketQuaThua", loi, "err");
    return;
  }

  if (thuaList.some(x => x.key === key)) {
    setNotice("ketQuaThua", "Thửa này đã có trong danh sách nhập.", "err");
    return;
  }

  parcel.key = key;
  thuaList.push(parcel);
  capNhatDanhSachThua();
  lamTrangThongTinThuaSauKhiThem();
}

function kiemTraThongTinDatTruocKhiThem(parcel) {
  const thua = parcel.thuaDat || {};
  const dat1 = parcel.dat1 || {};
  const dat2 = parcel.dat2 || {};

  if (!thua.soTo || !thua.soThua) return "Vui lòng nhập số tờ/số thửa.";
  if (!thua.dienTichTong) return "Vui lòng nhập diện tích thửa đất.";
  if (!dat1.loaiDat || !dat1.dienTich || !dat1.nguonGocSuDung || !dat1.hinhThucSuDung || !dat1.thoiHanSuDung) {
    return "Vui lòng nhập đủ Loại đất 1, Diện tích, Nguồn gốc, Hình thức, Thời hạn.";
  }

  const coDat2 = dat2.loaiDat2 || dat2.dienTich2 || dat2.nguonGocSuDung2 || dat2.hinhThucSuDung2 || dat2.thoiHanSuDung2;
  if (coDat2) {
    if (!dat2.loaiDat2 || !dat2.dienTich2 || !dat2.nguonGocSuDung2 || !dat2.hinhThucSuDung2 || !dat2.thoiHanSuDung2) {
      return "Nếu có loại đất 2 thì phải nhập đủ thông tin loại đất 2.";
    }
    const tong = parseNumberVN(thua.dienTichTong);
    const dt1 = parseNumberVN(dat1.dienTich);
    const dt2 = parseNumberVN(dat2.dienTich2);
    if (isNaN(tong) || isNaN(dt1) || isNaN(dt2)) return "Diện tích phải là số.";
    if (Math.abs((dt1 + dt2) - tong) > 0.0001) return "Diện tích loại đất 1 + loại đất 2 phải bằng diện tích thửa đất.";
  }

  return "";
}



function capNhatDanhSachThua() {
  const box = document.getElementById("danhSachThuaBox");
  const counter = document.getElementById("parcelCounter");
  if (counter) counter.textContent = `${thuaList.length} thửa`;

  if (!thuaList.length) {
    box.className = "parcel-list-empty";
    box.innerHTML = "Chưa có thửa nào. Nếu chỉ nhập 1 thửa, có thể lưu trực tiếp.";
    return;
  }

  box.className = "parcel-table-wrap";
  const rows = thuaList.map((p, i) => {
    const t = p.thuaDat || {};
    const d1 = p.dat1 || {};
    const d2 = p.dat2 || {};
    const dat2Text = d2.loaiDat2 ? `${escapeHtml(d2.loaiDat2)} (${escapeHtml(d2.dienTich2 || "")})` : "";
    return `
      <tr>
        <td class="center">${i + 1}</td>
        <td><b>${escapeHtml(t.soTo)}</b></td>
        <td><b>${escapeHtml(t.soThua)}</b></td>
        <td>${escapeHtml(t.dienTichTong || "")}</td>
        <td>${escapeHtml(d1.loaiDat || "")} ${d1.dienTich ? "(" + escapeHtml(d1.dienTich) + ")" : ""}</td>
        <td>${dat2Text}</td>
        <td class="center">
          <button type="button" class="mini-btn danger" onclick="xoaThuaKhoiDanhSach(${i})">Xóa</button>
        </td>
      </tr>
    `;
  }).join("");

  box.innerHTML = `
    <table class="parcel-table">
      <thead>
        <tr>
          <th>STT</th>
          <th>Số tờ</th>
          <th>Số thửa</th>
          <th>Diện tích</th>
          <th>Loại đất 1</th>
          <th>Loại đất 2</th>
          <th>Xóa</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function xoaThuaKhoiDanhSach(index) {
  thuaList.splice(index, 1);
  capNhatDanhSachThua();
}


function xoaDanhSachThua() {
  thuaList = [];
  capNhatDanhSachThua();
}

function lamTrangThongTinThuaSauKhiThem() {
  [
    "soTo","soThua","soToGCN","soThuaGCN","maDinhDanh","dienTichTong","ghiChu",
    "loaiDat","dienTich1","nguonGocSuDung","thoiHanSuDung",
    "loaiDat2","dienTich2","nguonGocSuDung2","hinhThucSuDung2","thoiHanSuDung2"
  ].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.value = "";
      if (id !== "dienTich2") el.readOnly = false;
    }
  });
  document.getElementById("hinhThucSuDung").value = "Sử dụng riêng";
  document.getElementById("dienTich2").readOnly = true;
  anDat2();
  capNhatDiaChiXa();
  capNhatSoPhatHanhMacDinh();
  daKiemTraThua = false;
  dangTrungThua = false;
  setNotice("ketQuaThua", "Đã thêm thửa vào danh sách. Nhập thửa tiếp theo.", "ok");

function capNhatTheoLoaiDat1() {
  const loai = val("loaiDat"), th = document.getElementById("thoiHanSuDung"), dt1 = document.getElementById("dienTich1");
  if (loai === "ODT" || loai === "ONT") {

function tinhTongDienTichCon() {
  const box = document.getElementById("kiemTraTongDienTich");
  if (!box || document.getElementById("boxDat2").style.display === "none") return;
  const tong = parseNumberVN(val("dienTichTong")), dt1 = parseNumberVN(val("dienTich1"));
  if (!isNaN(tong) && !isNaN(dt1)) document.getElementById("dienTich2").value = tong - dt1 >= 0 ? lamGonSo(tong - dt1) : "";
  box.className = "notice ok"; box.textContent = "Diện tích loại đất 2 tự tính là " + val("dienTich2");

function taoTenHSQTheoLoai(kind) {
  const ma = val("maXa") || "24373";
  const soTo = val("soTo");
  const soThua = val("soThua");
  const sph = val("soPhatHanh");

  if (kind === "DDK") {
    if (!soTo || !soThua) return "";
    return `CHUACOGIAY_${ma}_${soTo}_${soThua}-DDK.pdf`;
  }

  if (kind === "GT_CHUA_CO") {
    if (!soTo || !soThua) return "";
    return `CHUACOGIAY_${ma}_${soTo}_${soThua}-GT.pdf`;
  }

  // Trường hợp Đã có GCN: chỉ đặt theo Số phát hành GCN
  if (!sph) return "";
  if (kind === "GCN") return `${sph}-GCN.pdf`;
  if (kind === "GT_DA_CO") return `${sph}-GT.pdf`;

  return "";
}

function capNhatTenFileHSQ() {
  [["tenDDK","DDK"],["tenGTChuaCo","GT_CHUA_CO"],["tenGCN","GCN"],["tenGTDaCo","GT_DA_CO"]].forEach(([id,k]) => {

function getFileItems() {

  if (cheDo === "Chưa được cấp GCN") {
    if (document.getElementById("donDangKy").checked) items.push({kind:"DDK",label:"Đơn đăng ký",inputId:"fileDDK",targetName:taoTenHSQTheoLoai("DDK")});
    if (document.getElementById("giayToChuaCo").checked) items.push({kind:"GT_CHUA_CO",label:"Giấy tờ",inputId:"fileGTChuaCo",targetName:taoTenHSQTheoLoai("GT_CHUA_CO")});
  } else {
    if (document.getElementById("giayChungNhan").checked) items.push({kind:"GCN",label:"Giấy chứng nhận",inputId:"fileGCN",targetName:taoTenHSQTheoLoai("GCN")});
    if (document.getElementById("giayToDaCo").checked) items.push({kind:"GT_DA_CO",label:"Giấy tờ",inputId:"fileGTDaCo",targetName:taoTenHSQTheoLoai("GT_DA_CO")});
  }
  return items;
}

function readFilesForPayload() {
  const items = getFileItems();
  return Promise.all(items.map(item => new Promise((resolve, reject) => {
    const input = document.getElementById(item.inputId);
    const file = input && input.files && input.files[0] ? input.files[0] : null;
    if (!file) return resolve({...item, missing:true});
    if (file.type !== "application/pdf") return reject(new Error(item.label + ": chỉ cho phép file PDF."));
    const reader = new FileReader();
    reader.onload = e => resolve({...item, name:file.name, mimeType:file.type, base64:String(e.target.result).split(",")[1]});
    reader.onerror = () => reject(new Error(item.label + ": không đọc được file."));
    reader.readAsDataURL(file);
  })));
}


function validateSoPhatHanhGCN(value) {
  const s = String(value || "").trim().toUpperCase();
  if (!s) return false;

  // Chỉ số: đúng 10 số, không dấu cách
  if (/^\d{10}$/.test(s)) return true;

  // Có chữ + số: bắt buộc có đúng 1 dấu cách giữa chữ và số
  if (!/^[A-ZĐ]{1,2} \d+$/.test(s)) return false;

  const parts = s.split(" ");
  if (parts.length !== 2) return false;

  const letters = parts[0];

  // Tính cả khoảng trắng:
  // 1 ký tự chữ phía trước: tổng độ dài 8 hoặc 9
  if (letters.length === 1) {
    return s.length === 8 || s.length === 9;
  }

  // 2 ký tự chữ phía trước: tổng độ dài 9 hoặc 11
  if (letters.length === 2) {
    return s.length === 9 || s.length === 11;
  }

  return false;
}

function kiemTraSoPhatHanhGCN() {
  if (cheDo !== "Đã có GCN") return true;

  const input = document.getElementById("soPhatHanh");
  const box = document.getElementById("loiSoPhatHanh");
  const value = input ? input.value.trim() : "";

  if (!value) {
    if (box) box.style.display = "none";
    return false;
  }

  if (!validateSoPhatHanhGCN(value)) {
    if (box) {
      box.style.display = "block";
      box.className = "notice err";
      box.textContent = "nhập không đúng!";
    }
    if (input) input.classList.add("input-error");
    return false;
  }

  if (box) {
    box.style.display = "block";
    box.className = "notice ok";
    box.textContent = "Số phát hành GCN hợp lệ.";
  }
  if (input) input.classList.remove("input-error");
  return true;
}


function thuThapDuLieu(files) {
  const owners = [...document.querySelectorAll(".owner")].map(o => ({
    hoTen:o.querySelector(".hoTen").value.trim(), ngaySinh:o.querySelector(".ngaySinh").value.trim(), gioiTinh:o.querySelector(".gioiTinh").value.trim(),
    cccd:o.querySelector(".cccd").value.trim(), diaChiThuongTru:o.querySelector(".diaChiThuongTru").value.trim(),
    phapNhan:o.querySelector(".phapNhan").value.trim(), vaiTroPhapNhan:o.querySelector(".vaiTroPhapNhan").value.trim(), optional:o.dataset.optional==="1"
  })).filter(o => !o.optional || o.hoTen || o.ngaySinh || o.gioiTinh || o.cccd || o.diaChiThuongTru);

  return {
    maXa: val("maXa") || "24373", doiTuong, cheDo, loaiChu,
    gcn: {soPhatHanh:val("soPhatHanh"), ngayCap:val("ngayCap"), soVaoSo:val("soVaoSo"), soToGCN:val("soToGCN"), soThuaGCN:val("soThuaGCN")},
    chuSuDung: doiTuong === "Tổ chức" ? [{
      hoTen: val("hoTenDaiDien"),
      ngaySinh: val("ngaySinhDaiDien"),
      gioiTinh: val("gioiTinhDaiDien"),
      cccd: val("maDinhDanhCaNhanDaiDien"),
      diaChiThuongTru: val("diaChiThuongTruDaiDien"),
      phapNhan: "Tổ chức",
      vaiTroPhapNhan: ""
    }] : owners,
    toChuc: {
      tenToChuc: val("tenToChuc"),
      maDinhDanhToChuc: val("maDinhDanhToChuc"),
      hoTenDaiDien: val("hoTenDaiDien"),
      ngaySinhDaiDien: val("ngaySinhDaiDien"),
      gioiTinhDaiDien: val("gioiTinhDaiDien"),
      maDinhDanhCaNhanDaiDien: val("maDinhDanhCaNhanDaiDien"),
      diaChiThuongTruDaiDien: val("diaChiThuongTruDaiDien"),
      phapNhan: "Tổ chức"
    },
    thuaDat: {soTo:val("soTo"), soThua:val("soThua"), maDinhDanh:val("maDinhDanh"), diaChiThua:val("diaChiThua"), dienTichTong:val("dienTichTong"), ghiChu:val("ghiChu")},
    dat1: {loaiDat:val("loaiDat"), dienTich:val("dienTich1"), nguonGocSuDung:val("nguonGocSuDung"), hinhThucSuDung:val("hinhThucSuDung"), thoiHanSuDung:val("thoiHanSuDung")},
    dat2: {loaiDat2:val("loaiDat2"), dienTich2:val("dienTich2"), nguonGocSuDung2:val("nguonGocSuDung2"), hinhThucSuDung2:val("hinhThucSuDung2"), thoiHanSuDung2:val("thoiHanSuDung2")},
    hsq: {donDangKy:document.getElementById("donDangKy").checked, giayTo: cheDo==="Chưa được cấp GCN" ? document.getElementById("giayToChuaCo").checked : document.getElementById("giayToDaCo").checked, giayChungNhan:document.getElementById("giayChungNhan").checked},
    files: files || [],
    thuaList: thuaList.length ? thuaList : []
  };
}

function kiemTraTruocClient(data) {
  if (doiTuong === "Tổ chức") {
    const tc = data.toChuc || {};
    if (!tc.tenToChuc) return "Vui lòng nhập Tên tổ chức.";
    if (tc.maDinhDanhCaNhanDaiDien && !/^\d{12}$/.test(String(tc.maDinhDanhCaNhanDaiDien))) {
      return "Mã định danh cá nhân phải đủ 12 số.";
    }
  }
  if (cheDo === "Đã có GCN" && !kiemTraSoPhatHanhGCN()) return "nhập không đúng!";
  if (dangTrungThua) return "Thửa này đã được nhập rồi";
  if (!thuaList.length && !daKiemTraThua) return "Vui lòng kiểm tra số tờ/số thửa hợp lệ trước khi lưu.";
  if (!thuaList.length) {
    const loiDat = kiemTraThongTinDatTruocKhiThem(layThuaHienTai());
    if (loiDat) return loiDat;
  }
  if (thuaList.length && daKiemTraThua) {
    // Nếu đang có một thửa đã kiểm tra nhưng chưa bấm thêm, tự thêm thửa hiện tại vào cuối danh sách
    const parcel = layThuaHienTai();
    const t = parcel.thuaDat || {};
    const key = `${val("maXa")}_${t.soTo}_${t.soThua}`;
    if (t.soTo && t.soThua && !thuaList.some(x => x.key === key)) {
      const loi = kiemTraThongTinDatTruocKhiThem(parcel);
      if (loi) return loi;
      parcel.key = key;
      thuaList.push(parcel);
      capNhatDanhSachThua();
    }
  }
  return "";
}

function xemTruoc() {
  readFilesForPayload().then(files => {
    const data = thuThapDuLieu(files);
    const loi = kiemTraTruocClient(data);
    if (loi) { setStatus(loi,"err"); document.getElementById("btnLuu").style.display="none"; return; }
    const text = [`Mã xã: ${data.maXa}`,`Đối tượng: ${data.doiTuong}`,`Loại hồ sơ: ${data.cheDo}`,`Số thửa sẽ lưu: ${(data.thuaList && data.thuaList.length) ? data.thuaList.length : 1}`,`Số file PDF: ${files.filter(f=>!f.missing).length}`,`Số người sử dụng: ${data.chuSuDung.length}`].join("\n");
    document.getElementById("preview").innerHTML = `<div class="preview-box">${escapeHtml(text)}</div>`;
    document.getElementById("btnLuu").style.display = "inline-block";
    setStatus("Thông tin đã sẵn sàng. Bấm Xác nhận để lưu.","ok");
  }).catch(err => setStatus(err.message,"err"));
}

function luuDuLieu() {
  setStatus("Đang đọc file PDF...","muted");
  document.getElementById("btnLuu").disabled = true;
  readFilesForPayload().then(files => {
    const missing = files.find(f => f.missing);
    if (missing) throw new Error("Vui lòng chọn file PDF: " + missing.label);
    const data = thuThapDuLieu(files);
    const loi = kiemTraTruocClient(data);
    if (loi) throw new Error(loi);
    setStatus("Đang lưu dữ liệu và upload PDF...","muted");
    google.script.run.withSuccessHandler(res => {
      document.getElementById("btnLuu").disabled = false;
      if (!res.ok) { setStatus(res.message,"err"); return; }
      const uploadText = (res.uploadedFiles || []).map(f => `${f.label}: ${f.name}`).join("\n");
      setNotice("trangThaiUpload", "Đã upload hồ sơ quét.\n" + uploadText, "ok");
      setStatus(res.message + " Hồ sơ quét đã tải lên Drive bảo mật.","ok");
      lamTrangBieuMauSauKhiLuu();
    }).withFailureHandler(err => {
      document.getElementById("btnLuu").disabled = false;
      setStatus(err.message || "Có lỗi khi lưu.","err");
    }).saveHoSoWithFiles(data);
  }).catch(err => { document.getElementById("btnLuu").disabled = false; setStatus(err.message,"err"); });
}

function lamTrangBieuMauSauKhiLuu() {
  ["tenToChuc","maDinhDanhToChuc","hoTenDaiDien","ngaySinhDaiDien","gioiTinhDaiDien","maDinhDanhCaNhanDaiDien","diaChiThuongTruDaiDien","soPhatHanh","ngayCap","soVaoSo","soToGCN","soThuaGCN","soTo","soThua","maDinhDanh","dienTichTong","loaiDat","dienTich1","thoiHanSuDung","nguonGocSuDung","ghiChu","loaiDat2","dienTich2","hinhThucSuDung2","thoiHanSuDung2","nguonGocSuDung2","fileDDK","fileGTChuaCo","fileGCN","fileGTDaCo"].forEach(id => {
    const el = document.getElementById(id); if (el) { el.value=""; if (id!=="dienTich2") el.readOnly=false; }
  });
  document.getElementById("dienTich2").readOnly = true;
  capNhatDiaChiXa(); capNhatSoPhatHanhMacDinh(); taoDanhSachNguoiTheoLoai(); anDat2();
  thuaList = [];
  capNhatDanhSachThua();
  daKiemTraThua=false; dangTrungThua=false;
  document.getElementById("preview").innerHTML=""; document.getElementById("btnLuu").style.display="none";
  setNotice("ketQuaThua","Nhập số tờ và số thửa để kiểm tra.","muted");
}

function val(id){const el=document.getElementById(id);return el?String(el.value||"").trim():"";}
function setNotice(id,msg,type){const el=document.getElementById(id);el.className="notice "+type;el.textContent=msg;}
function setStatus(msg,type){setNotice("status",msg,type);}
function parseNumberVN(v){let s=String(v||"").trim().replace(/\s/g,"");if(!s)return NaN;if(s.includes(",")&&s.includes("."))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(",",".");return Number(s);}
function lamGonSo(n){return isNaN(n)?"":Number(Math.round(n*10000)/10000).toString();}
function escapeHtml(str){return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
